<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Jeddy Cars</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page-loader"><div class="loader-mark"><svg viewBox="0 0 64 64"><circle class="loader-ring" cx="32" cy="32" r="26"/><circle class="loader-arc" cx="32" cy="32" r="26"/></svg></div><div class="loader-text">Jeddy Cars</div></div>
<div id="site-nav"></div>
<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span>Contact</span></div>
      <div class="section-eyebrow">We're Here To Help</div>
      <h1 class="section-title">Contact Jeddy Cars</h1>
    </div>
  </section>

  <section class="section-tight">
    <div class="container" style="display:grid; grid-template-columns:1fr 1fr; gap:48px;">
      <div class="reveal">
        <div class="auth-card">
          <h3 class="font-display" style="font-size:20px; margin-bottom:20px;">Send Us a Message</h3>
          <form onsubmit="submitContact(event)">
            <div class="form-row-2">
              <div class="form-group"><label>Full Name</label><input required type="text"></div>
              <div class="form-group"><label>Email</label><input required type="email"></div>
            </div>
            <div class="form-group"><label>Subject</label>
              <select><option>General Inquiry</option><option>Vehicle Availability</option><option>Financing</option><option>After-Sales Support</option></select>
            </div>
            <div class="form-group"><label>Message</label><textarea required placeholder="How can we help?"></textarea></div>
            <button class="btn btn-gold btn-block" type="submit">Send Message</button>
          </form>
        </div>

        <div class="grid grid-3" style="margin-top:24px; gap:16px;">
          <div class="testimonial-card" style="padding:20px;">
            <h4 style="font-size:13px; text-transform:uppercase; color:var(--gold); letter-spacing:.08em;">Phone</h4>
            <a href="tel:+2348121101146" style="font-size:15px;">0812 110 1146</a>
          </div>
          <div class="testimonial-card" style="padding:20px;">
            <h4 style="font-size:13px; text-transform:uppercase; color:var(--gold); letter-spacing:.08em;">Email</h4>
            <a href="mailto:jeddybackupgmail@gmail.com" style="font-size:15px;">jeddybackupgmail@gmail.com</a>
          </div>
          <div class="testimonial-card" style="padding:20px;">
            <h4 style="font-size:13px; text-transform:uppercase; color:var(--gold); letter-spacing:.08em;">Hours</h4>
            <p style="font-size:14px; color:var(--ink-dim);">Mon–Sat: 9:00–19:00<br>Sun: Closed</p>
          </div>
        </div>
      </div>

      <div class="reveal">
        <div class="bracket-frame" style="border-radius:var(--radius); overflow:hidden; aspect-ratio:1/1; border:1px solid var(--hairline);">
          <span class="bk-tr"></span><span class="bk-bl"></span>
          <iframe title="Jeddy Cars Showroom Map" width="100%" height="100%" style="border:0; filter:grayscale(0.3) invert(0.9) contrast(0.9);"
            src="https://www.openstreetmap.org/export/embed.html?bbox=7.45%2C9.03%2C7.55%2C9.10&layer=mapnik&marker=9.06%2C7.49"></iframe>
        </div>
        <a href="https://wa.me/2348121101146" target="_blank" rel="noopener" class="btn btn-outline btn-block" style="margin-top:16px;">Chat on WhatsApp</a>
      </div>
    </div>
  </section>

  <section class="section" id="faq" style="border-top:1px solid var(--hairline);">
    <div class="container" style="max-width:760px;">
      <div class="section-head reveal" style="display:block;">
        <div class="section-eyebrow">Common Questions</div>
        <h2 class="section-title">Frequently Asked Questions</h2>
      </div>
      <div id="faq-list"></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function submitContact(e){ e.preventDefault(); toast('Message sent — we\'ll reply within 24 hours.'); e.target.reset(); }
const faqs = [
  ["Can I reserve a vehicle without visiting the showroom?", "Yes — every listing has a Reserve button that holds the vehicle for 48 hours with a fully refundable deposit."],
  ["Do you offer financing for used vehicles?", "Yes, financing applies to both new and used vehicles, subject to lender approval and vehicle age limits."],
  ["Is the listed price negotiable?", "Listed prices reflect our best market rate. Trade-ins and bulk/fleet purchases may qualify for adjustments — ask your specialist."],
  ["What documents do I need for a finance application?", "A valid ID, proof of income, and proof of address. Our team will confirm exact requirements based on your lender."],
  ["Can I book an inspection before buying?", "Absolutely — use the Book Inspection button on any vehicle page to schedule a showroom or mobile inspection."]
];
document.addEventListener('DOMContentLoaded', ()=>{
  const host = document.getElementById('faq-list');
  faqs.forEach(([q,a],i)=>{
    host.insertAdjacentHTML('beforeend', `
      <div class="reveal" style="border-bottom:1px solid var(--hairline); padding:18px 0;">
        <button onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='block'?'none':'block'; this.querySelector('span').textContent = this.querySelector('span').textContent==='+'?'−':'+';"
          style="width:100%; display:flex; justify-content:space-between; align-items:center; background:none; border:none; color:var(--ink); font-size:15px; text-align:left; font-family:'Fraunces',serif;">
          ${q}<span style="color:var(--gold); font-size:20px;">+</span>
        </button>
        <p style="display:none; color:var(--ink-dim); font-size:14px; margin-top:12px; line-height:1.7;">${a}</p>
      </div>`);
  });
});
</script>
</body>
</html>
