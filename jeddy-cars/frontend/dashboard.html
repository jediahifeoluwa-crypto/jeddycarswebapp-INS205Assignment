<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — Jeddy Cars</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page-loader"><div class="loader-mark"><svg viewBox="0 0 64 64"><circle class="loader-ring" cx="32" cy="32" r="26"/><circle class="loader-arc" cx="32" cy="32" r="26"/></svg></div><div class="loader-text">Jeddy Cars</div></div>
<div id="site-nav"></div>
<main>
  <section class="page-hero">
    <div class="container">
      <div class="section-eyebrow">Your Account</div>
      <h1 class="section-title" id="welcome-title">Dashboard</h1>
    </div>
  </section>

  <section class="section-tight">
    <div class="container dash-layout">
      <aside class="dash-side">
        <a href="#" data-tab="overview" onclick="showDashTab('overview',this);return false;">Overview</a>
        <a href="#" data-tab="wishlist" onclick="showDashTab('wishlist',this);return false;">Wishlist</a>
        <a href="#" data-tab="recent" onclick="showDashTab('recent',this);return false;">Recently Viewed</a>
        <a href="#" data-tab="searches" onclick="showDashTab('searches',this);return false;">Saved Searches</a>
        <a href="#" data-tab="orders" onclick="showDashTab('orders',this);return false;">Purchase History</a>
        <a href="#" data-tab="appointments" onclick="showDashTab('appointments',this);return false;">Appointments</a>
        <a href="#" data-tab="notifications" onclick="showDashTab('notifications',this);return false;">Notifications</a>
        <a href="#" data-tab="security" onclick="showDashTab('security',this);return false;">Security</a>
        <a href="#" onclick="signOut();return false;" style="color:var(--ember-bright); margin-top:12px;">Sign Out</a>
      </aside>

      <div id="dash-content"></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
if(!AppState.user){ location.href = 'login.html'; }
if(AppState.user && AppState.user.role==='admin'){ location.href='admin.html'; }

document.getElementById('welcome-title').textContent = `Welcome back, ${AppState.user ? AppState.user.name.split(' ')[0] : ''}`;

const mockOrders = [
  { car:"Mercedes-Benz C-Class", date:"2026-05-12", status:"Delivered", amount:44900 },
  { car:"Toyota Land Cruiser 300", date:"2026-06-30", status:"Processing", amount:84500 },
];
const mockAppointments = [
  { car:"BMW M4 Competition", type:"Test Drive", date:"2026-07-24", time:"11:00 AM", status:"Confirmed" },
  { car:"Range Rover Sport", type:"Inspection", date:"2026-07-27", time:"2:30 PM", status:"Pending" },
];
const mockNotifications = [
  "Your reserved Mercedes-Benz S-Class is ready for pickup scheduling.",
  "Price drop: BMW X7 is now $4,000 off.",
  "Reminder: your test drive is in 3 days.",
];
const mockSearches = [
  { label:"SUVs under $100,000", url:"inventory.html?body=SUV&maxPrice=100000" },
  { label:"Electric vehicles", url:"inventory.html?q=tesla" },
];

function showDashTab(tab, el){
  document.querySelectorAll('.dash-side a').forEach(a=>a.classList.remove('active'));
  if(el) el.classList.add('active');
  const host = document.getElementById('dash-content');
  if(tab==='overview'){
    host.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-top">Wishlist</div><div class="kpi-num">${AppState.wishlist.length}</div></div>
      <div class="kpi-card"><div class="kpi-top">Purchases</div><div class="kpi-num">${mockOrders.length}</div></div>
      <div class="kpi-card"><div class="kpi-top">Appointments</div><div class="kpi-num">${mockAppointments.length}</div></div>
      <div class="kpi-card"><div class="kpi-top">Saved Searches</div><div class="kpi-num">${mockSearches.length}</div></div>
    </div>
    <h3 class="font-display" style="font-size:18px; margin-bottom:16px;">Recently Viewed</h3>
    <div class="grid grid-4" id="ov-recent"></div>`;
    renderGrid('ov-recent', AppState.recentlyViewed.map(findVehicle).filter(Boolean).slice(0,4));
  }
  if(tab==='wishlist'){
    const items = AppState.wishlist.map(findVehicle).filter(Boolean);
    host.innerHTML = `<h3 class="font-display" style="font-size:18px; margin-bottom:16px;">Your Wishlist</h3><div class="grid grid-3" id="wl-grid"></div>`;
    renderGrid('wl-grid', items);
  }
  if(tab==='recent'){
    const items = AppState.recentlyViewed.map(findVehicle).filter(Boolean);
    host.innerHTML = `<h3 class="font-display" style="font-size:18px; margin-bottom:16px;">Recently Viewed</h3><div class="grid grid-3" id="rv-grid"></div>`;
    renderGrid('rv-grid', items);
  }
  if(tab==='searches'){
    host.innerHTML = `<h3 class="font-display" style="font-size:18px; margin-bottom:16px;">Saved Searches</h3>` +
      mockSearches.map(s=>`<a href="${s.url}" class="testimonial-card" style="display:block; margin-bottom:12px; padding:18px;">${s.label} →</a>`).join('');
  }
  if(tab==='orders'){
    host.innerHTML = `<h3 class="font-display" style="font-size:18px; margin-bottom:16px;">Purchase History</h3>
    <table class="data-table"><tr><th>Vehicle</th><th>Date</th><th>Status</th><th>Amount</th></tr>
      ${mockOrders.map(o=>`<tr><td>${o.car}</td><td>${o.date}</td><td><span class="pill ${o.status==='Delivered'?'pill-green':'pill-gold'}">${o.status}</span></td><td>${fmtPrice(o.amount)}</td></tr>`).join('')}
    </table>`;
  }
  if(tab==='appointments'){
    host.innerHTML = `<h3 class="font-display" style="font-size:18px; margin-bottom:16px;">Appointments</h3>
    <table class="data-table"><tr><th>Vehicle</th><th>Type</th><th>Date</th><th>Time</th><th>Status</th></tr>
      ${mockAppointments.map(a=>`<tr><td>${a.car}</td><td>${a.type}</td><td>${a.date}</td><td>${a.time}</td><td><span class="pill ${a.status==='Confirmed'?'pill-green':'pill-gold'}">${a.status}</span></td></tr>`).join('')}
    </table>`;
  }
  if(tab==='notifications'){
    host.innerHTML = `<h3 class="font-display" style="font-size:18px; margin-bottom:16px;">Notifications</h3>` +
      mockNotifications.map(n=>`<div class="testimonial-card" style="margin-bottom:10px; padding:16px; flex-direction:row; align-items:center; gap:14px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--gold); flex-shrink:0;">${ICONS.bell}</svg><span style="font-size:14px;">${n}</span></div>`).join('');
  }
  if(tab==='security'){
    const isAdmin = AppState.user.role==='admin';
    host.innerHTML = `<h3 class="font-display" style="font-size:18px; margin-bottom:16px;">Security</h3>
    <div class="auth-card" style="max-width:440px; padding:28px;">
      <h4 style="font-size:15px; margin-bottom:16px;">Change Password</h4>
      ${isAdmin ? `<p style="color:var(--ink-dim); font-size:13.5px;">The admin demo account password is fixed and can't be changed here.</p>` : `
      <form id="cp-form" onsubmit="handleChangePassword(event)">
        <div class="form-group"><label>Current Password</label><input required type="password" id="cp-current"></div>
        <div class="form-group"><label>New Password</label><input required type="password" id="cp-new" minlength="6"></div>
        <div class="form-group"><label>Confirm New Password</label><input required type="password" id="cp-confirm" minlength="6"></div>
        <button class="btn btn-gold btn-block" type="submit">Update Password</button>
      </form>`}
    </div>`;
  }
}
function handleChangePassword(e){
  e.preventDefault();
  const current = document.getElementById('cp-current').value;
  const next = document.getElementById('cp-new').value;
  const confirm = document.getElementById('cp-confirm').value;
  if(next !== confirm){ toast('New passwords do not match'); return; }
  const res = changePassword(current, next);
  if(res.ok){ toast('Password updated'); e.target.reset(); }
  else { toast(res.msg); }
}
document.addEventListener('DOMContentLoaded', ()=>{
  const tab = new URLSearchParams(location.search).get('tab') || 'overview';
  const link = document.querySelector(`.dash-side a[data-tab="${tab}"]`);
  showDashTab(tab, link);
});
</script>
</body>
</html>
