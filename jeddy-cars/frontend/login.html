<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Jeddy Cars</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page-loader"><div class="loader-mark"><svg viewBox="0 0 64 64"><circle class="loader-ring" cx="32" cy="32" r="26"/><circle class="loader-arc" cx="32" cy="32" r="26"/></svg></div><div class="loader-text">Jeddy Cars</div></div>
<div id="site-nav"></div>
<main>
  <section class="hero auth-hero" id="auth-hero">
    <div class="container hero-content auth-hero-content">
      <div class="auth-wrap">
        <div class="text-center reveal" style="margin-bottom:28px;">
          <div class="section-eyebrow">Welcome Back</div>
          <h1 class="section-title" id="auth-heading">Sign In</h1>
        </div>
        <div class="auth-card reveal">
          <div id="login-panel">
            <form onsubmit="handleLogin(event)">
              <div class="form-group"><label>Email</label><input required type="email" id="li-email"></div>
              <div class="form-group">
                <label style="display:flex; justify-content:space-between;">Password <a href="#" onclick="showForgot(); return false;" style="color:var(--gold); text-transform:none; letter-spacing:0; font-size:12.5px;">Forgot password?</a></label>
                <input required type="password" id="li-pass">
              </div>
              <button class="btn btn-gold btn-block" type="submit">Sign In</button>
            </form>
            <p style="text-align:center; margin-top:18px; font-size:13.5px; color:var(--ink-dim);">Don't have an account? <a href="#" onclick="toggleAuth(); return false;" style="color:var(--gold);">Create one</a></p>
            
          </div>
          <div id="signup-panel" style="display:none;">
            <form onsubmit="handleSignup(event)">
              <div class="form-group"><label>Full Name</label><input required type="text" id="su-name"></div>
              <div class="form-group"><label>Email</label><input required type="email" id="su-email"></div>
              <div class="form-group"><label>Password</label><input required type="password" id="su-pass" minlength="6"></div>
              <button class="btn btn-gold btn-block" type="submit">Create Account</button>
            </form>
            <p style="text-align:center; margin-top:18px; font-size:13.5px; color:var(--ink-dim);">Already have an account? <a href="#" onclick="toggleAuth(); return false;" style="color:var(--gold);">Sign in</a></p>
          </div>
          <div id="forgot-panel" style="display:none;">
            <p style="font-size:13.5px; color:var(--ink-dim); margin-bottom:20px;">Enter the email on your account. <em>Demo note: no email server is connected here, so instead of waiting for an email, you'll set a new password directly on the next step.</em></p>
            <form id="forgot-email-form" onsubmit="handleForgotEmail(event)">
              <div class="form-group"><label>Email</label><input required type="email" id="fp-email"></div>
              <button class="btn btn-gold btn-block" type="submit">Send Reset Instructions</button>
            </form>
            <form id="forgot-reset-form" style="display:none;" onsubmit="handleForgotReset(event)">
              <div class="form-group"><label>New Password</label><input required type="password" id="fp-new-pass" minlength="6"></div>
              <div class="form-group"><label>Confirm New Password</label><input required type="password" id="fp-new-pass-confirm" minlength="6"></div>
              <button class="btn btn-gold btn-block" type="submit">Set New Password</button>
            </form>
            <p style="text-align:center; margin-top:18px; font-size:13.5px; color:var(--ink-dim);"><a href="#" onclick="showLogin(); return false;" style="color:var(--gold);">Back to sign in</a></p>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function showPanel(which){
  document.getElementById('login-panel').style.display = which==='login'? 'block':'none';
  document.getElementById('signup-panel').style.display = which==='signup'? 'block':'none';
  document.getElementById('forgot-panel').style.display = which==='forgot'? 'block':'none';
  const headings = { login:'Sign In', signup:'Create Your Account', forgot:'Reset Your Password' };
  document.getElementById('auth-heading').textContent = headings[which];
}
function toggleAuth(){
  const login = document.getElementById('login-panel').style.display !== 'none';
  showPanel(login ? 'signup' : 'login');
}
function showForgot(){
  showPanel('forgot');
  document.getElementById('forgot-email-form').style.display = 'block';
  document.getElementById('forgot-reset-form').style.display = 'none';
  document.getElementById('forgot-email-form').reset();
}
function showLogin(){ showPanel('login'); }
function handleLogin(e){
  e.preventDefault();
  const res = signIn(document.getElementById('li-email').value, document.getElementById('li-pass').value);
  if(res.ok){ location.href = res.role==='admin' ? 'admin.html' : 'dashboard.html'; }
  else { toast(res.msg); }
}
function handleSignup(e){
  e.preventDefault();
  const res = signUp(document.getElementById('su-name').value, document.getElementById('su-email').value, document.getElementById('su-pass').value);
  if(res.ok){ toast('Account created — welcome to Jeddy Cars!'); location.href='dashboard.html'; }
  else { toast(res.msg); }
}
function handleForgotEmail(e){
  e.preventDefault();
  const email = document.getElementById('fp-email').value;
  const res = requestPasswordReset(email);
  toast(res.msg);
  if(res.ok){
    const token = Store.get('jc_reset_token', null);
    // Only advance to the reset step if an account actually matched —
    // otherwise stay put so we don't confirm/deny account existence.
    if(token && token.email===email){
      document.getElementById('forgot-email-form').style.display = 'none';
      document.getElementById('forgot-reset-form').style.display = 'block';
      document.getElementById('forgot-reset-form').dataset.email = email;
    }
  }
}
function handleForgotReset(e){
  e.preventDefault();
  const email = document.getElementById('forgot-reset-form').dataset.email;
  const p1 = document.getElementById('fp-new-pass').value;
  const p2 = document.getElementById('fp-new-pass-confirm').value;
  if(p1 !== p2){ toast('Passwords do not match'); return; }
  const res = resetPassword(email, p1);
  if(res.ok){ toast('Password updated — you can now sign in.'); showLogin(); }
  else { toast(res.msg); }
}
document.addEventListener('DOMContentLoaded', ()=>{
  const mode = new URLSearchParams(location.search).get('mode');
  if(mode==='signup') showPanel('signup');
  if(mode==='forgot') showForgot();
});

// reusing real vehicle photos from data.js for the background
(function initAuthHero(){
  const showcaseIds = ['mb-g-wagon','bmw-m4','tesla-model-s','range-rover-sport','porsche-cayenne'];
  const hero = document.getElementById('auth-hero');
  const images = showcaseIds.map(id => findVehicle(id)).filter(Boolean).map(v => v.images[0]);
  if(!images.length) return;
  images.forEach((url, i) => {
    const div = document.createElement('div');
    div.className = 'hero-slide' + (i===0 ? ' active' : '');
    div.style.backgroundImage = `url('${url}')`;
    hero.insertBefore(div, hero.firstChild);
  });
  let current = 0;
  const slides = hero.querySelectorAll('.hero-slide');
  setInterval(()=>{
    slides[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
  }, 5000);
})();
</script>
</body>
</html>
