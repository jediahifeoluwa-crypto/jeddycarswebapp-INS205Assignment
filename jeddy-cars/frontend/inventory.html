<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory — Jeddy Cars</title>
<meta name="description" content="Browse the full Jeddy Cars inventory — filter by brand, price, year, fuel type, transmission, body type and more.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page-loader"><div class="loader-mark"><svg viewBox="0 0 64 64"><circle class="loader-ring" cx="32" cy="32" r="26"/><circle class="loader-arc" cx="32" cy="32" r="26"/></svg></div><div class="loader-text">Jeddy Cars</div></div>
<div id="site-nav"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span>Inventory</span></div>
      <div class="section-eyebrow">Full Collection</div>
      <h1 class="section-title">Vehicle Inventory</h1>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <form class="filter-bar" id="filter-form">
        <div class="field"><label>Keyword</label><input type="text" id="f-q" placeholder="Brand or model"></div>
        <div class="field"><label>Brand</label><select id="f-brand"><option value="">Any Brand</option></select></div>
        <div class="field"><label>Body Type</label><select id="f-body"><option value="">Any Body</option></select></div>
        <div class="field"><label>Max Price</label><select id="f-price">
          <option value="">Any Price</option>
          <option value="30000">Under $30,000</option>
          <option value="60000">Under $60,000</option>
          <option value="100000">Under $100,000</option>
          <option value="150000">Under $150,000</option>
          <option value="250000">Under $250,000</option>
        </select></div>
        <div class="field"><label>Fuel Type</label><select id="f-fuel">
          <option value="">Any Fuel</option><option>Petrol</option><option>Diesel</option><option>Electric</option><option>Hybrid</option><option>Petrol Hybrid</option>
        </select></div>
        <div class="field"><label>Condition</label><select id="f-condition"><option value="">Any Condition</option><option>New</option><option>Used</option></select></div>
      </form>

      <div class="results-bar">
        <div class="results-count"><strong id="result-count">0</strong> vehicles found</div>
        <div style="display:flex; gap:14px; align-items:center;">
          <select id="f-sort" style="background:var(--card); border:1px solid var(--hairline); color:var(--ink); padding:9px 12px; border-radius:6px; font-size:13px;">
            <option value="relevance">Sort: Relevance</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="year-desc">Year: Newest First</option>
            <option value="mileage-asc">Mileage: Lowest First</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="clearFilters()" type="button">Clear All</button>
        </div>
      </div>
      <div class="chip-row" id="active-chips" style="margin-bottom:24px;"></div>

      <div class="grid grid-4" id="inventory-grid"></div>
    </div>
  </section>

  <section class="section-tight" style="border-top:1px solid var(--hairline);">
    <div class="container text-center reveal">
      <div class="section-eyebrow">Not Sure Where To Start?</div>
      <h2 class="section-title" style="margin-bottom:20px;">Take the 60-Second Car Match Quiz</h2>
      <p class="section-desc" style="margin:0 auto 28px;">Answer a few questions about how you drive and we'll shortlist vehicles built for you.</p>
      <button class="btn btn-gold" onclick="openQuiz()">Start The Quiz</button>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<!-- Quiz modal -->
<div class="modal-overlay" id="quiz-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeQuiz()">&times;</button>
    <h3 class="font-display" style="font-size:22px; margin-bottom:18px;">Find Your Match</h3>
    <div id="quiz-body"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
let currentResults = [...VEHICLES];

function populateSelects(){
  const brandSel = document.getElementById('f-brand');
  BRANDS.forEach(b=> brandSel.insertAdjacentHTML('beforeend', `<option>${b}</option>`));
  const bodySel = document.getElementById('f-body');
  BODY_TYPES.forEach(b=> bodySel.insertAdjacentHTML('beforeend', `<option>${b}</option>`));
}

function readParamsIntoFilters(){
  const p = new URLSearchParams(location.search);
  if(p.get('q')) document.getElementById('f-q').value = p.get('q');
  if(p.get('brand')) document.getElementById('f-brand').value = p.get('brand');
  if(p.get('body')) document.getElementById('f-body').value = p.get('body');
  if(p.get('maxPrice')) document.getElementById('f-price').value = p.get('maxPrice');
  if(p.get('condition')) document.getElementById('f-condition').value = p.get('condition');
  if(p.get('tag')==='new') document.getElementById('f-q').dataset.tag='new';
  if(p.get('tag')==='bestseller') document.getElementById('f-q').dataset.tag='bestseller';
}

function applyFilters(){
  const q = document.getElementById('f-q').value.toLowerCase().trim();
  const brand = document.getElementById('f-brand').value;
  const body = document.getElementById('f-body').value;
  const maxPrice = document.getElementById('f-price').value;
  const fuel = document.getElementById('f-fuel').value;
  const condition = document.getElementById('f-condition').value;
  const sort = document.getElementById('f-sort').value;
  const tag = document.getElementById('f-q').dataset.tag;

  let results = VEHICLES.filter(v=>{
    if(q && !(`${v.brand} ${v.model}`.toLowerCase().includes(q))) return false;
    if(brand && v.brand!==brand) return false;
    if(body && v.body!==body) return false;
    if(maxPrice && v.price>+maxPrice) return false;
    if(fuel && v.fuel!==fuel) return false;
    if(condition && v.condition!==condition) return false;
    if(tag==='new' && v.tag!=='new') return false;
    if(tag==='bestseller' && !v.bestseller) return false;
    return true;
  });

  if(sort==='price-asc') results.sort((a,b)=>a.price-b.price);
  if(sort==='price-desc') results.sort((a,b)=>b.price-a.price);
  if(sort==='year-desc') results.sort((a,b)=>b.year-a.year);
  if(sort==='mileage-asc') results.sort((a,b)=>a.mileage-b.mileage);

  currentResults = results;
  document.getElementById('result-count').textContent = results.length;
  renderGrid('inventory-grid', results);
  renderChips();
}

function renderChips(){
  const chips = [];
  const map = {
    'f-q':'Keyword','f-brand':'Brand','f-body':'Body','f-price':'Max Price','f-fuel':'Fuel','f-condition':'Condition'
  };
  Object.keys(map).forEach(id=>{
    const el = document.getElementById(id);
    if(el.value) chips.push({id, label: `${map[id]}: ${id==='f-price'?fmtPrice(+el.value):el.value}`});
  });
  const host = document.getElementById('active-chips');
  host.innerHTML = chips.map(c=>`<span class="chip">${c.label}<button onclick="clearOne('${c.id}')">&times;</button></span>`).join('');
}
function clearOne(id){ document.getElementById(id).value=''; applyFilters(); }
function clearFilters(){
  ['f-q','f-brand','f-body','f-price','f-fuel','f-condition'].forEach(id=>document.getElementById(id).value='');
  delete document.getElementById('f-q').dataset.tag;
  document.getElementById('f-sort').value='relevance';
  applyFilters();
}

document.addEventListener('DOMContentLoaded', ()=>{
  populateSelects();
  readParamsIntoFilters();
  applyFilters();
  document.querySelectorAll('#filter-form select, #filter-form input, #f-sort').forEach(el=>{
    el.addEventListener('input', applyFilters);
    el.addEventListener('change', applyFilters);
  });
  document.getElementById('filter-form').addEventListener('submit', e=>e.preventDefault());
});

// car match quiz
const quizQuestions = [
  { q:"What matters most to you?", options:["Raw performance","Family comfort","Efficiency & running cost","Off-road capability"] },
  { q:"Preferred body style?", options:["Sedan","SUV","Coupe","No preference"] },
  { q:"Budget range?", options:["Under $50,000","$50,000–$100,000","$100,000+"] }
];
let quizAnswers = [];
let quizStep = 0;
function openQuiz(){ quizStep=0; quizAnswers=[]; document.getElementById('quiz-modal').classList.add('show'); renderQuizStep(); }
function closeQuiz(){ document.getElementById('quiz-modal').classList.remove('show'); }
function renderQuizStep(){
  const body = document.getElementById('quiz-body');
  if(quizStep>=quizQuestions.length){
    // quick and dirty matching, nothing fancy
    let results = [...VEHICLES];
    if(quizAnswers[0]==='Raw performance') results = results.filter(v=>v.horsepower>350);
    if(quizAnswers[0]==='Family comfort') results = results.filter(v=>v.body==='SUV'||v.body==='Sedan');
    if(quizAnswers[0]==='Efficiency & running cost') results = results.filter(v=>['Hybrid','Electric','Petrol Hybrid'].includes(v.fuel));
    if(quizAnswers[0]==='Off-road capability') results = results.filter(v=>v.drivetrain.includes('4WD')||v.drivetrain.includes('AWD'));
    if(quizAnswers[1] && quizAnswers[1]!=='No preference') results = results.filter(v=>v.body.includes(quizAnswers[1]));
    if(quizAnswers[2]==='Under $50,000') results = results.filter(v=>v.price<50000);
    if(quizAnswers[2]==='$50,000–$100,000') results = results.filter(v=>v.price>=50000 && v.price<=100000);
    if(quizAnswers[2]==='$100,000+') results = results.filter(v=>v.price>100000);
    if(results.length===0) results = VEHICLES.slice(0,3);
    body.innerHTML = `<p style="color:var(--ink-dim); margin-bottom:16px;">Your top matches:</p>` +
      results.slice(0,3).map(v=>`<a href="vehicle.html?id=${v.id}" style="display:flex; gap:12px; align-items:center; padding:10px; border:1px solid var(--hairline); border-radius:8px; margin-bottom:10px;">
        <img src="${v.images[0]}" style="width:70px;height:50px;object-fit:cover;border-radius:6px;"><div><strong>${v.brand} ${v.model}</strong><div style="color:var(--ink-dim); font-size:13px;">${fmtPrice(v.price)}</div></div></a>`).join('');
    body.insertAdjacentHTML('beforeend', `<button class="btn btn-outline btn-block" onclick="openQuiz()">Retake Quiz</button>`);
    return;
  }
  const step = quizQuestions[quizStep];
  body.innerHTML = `<p style="color:var(--ink-dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px;">Question ${quizStep+1} of ${quizQuestions.length}</p>
    <h4 style="font-family:'Fraunces',serif; font-size:18px; margin-bottom:18px;">${step.q}</h4>
    <div style="display:flex; flex-direction:column; gap:10px;">
      ${step.options.map(o=>`<button class="btn btn-outline btn-block" style="justify-content:flex-start;" onclick="answerQuiz('${o}')">${o}</button>`).join('')}
    </div>`;
}
function answerQuiz(ans){ quizAnswers.push(ans); quizStep++; renderQuizStep(); }
</script>
</body>
</html>
