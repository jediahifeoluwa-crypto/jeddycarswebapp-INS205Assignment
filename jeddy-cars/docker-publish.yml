name: Build and push Docker image

# Runs on every push to main, and lets you trigger it manually too.
# Tags the image with both the git commit SHA and "latest" so you
# always have a specific, pinnable version plus a moving target.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jeddy-cars-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jeddy-cars-frontend:${{ github.sha }}
